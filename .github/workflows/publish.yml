name: Publish

# Publishes to npm through trusted publishing (OIDC); no npm token is stored. The trusted
# publisher on npmjs.com is configured for this file and the `npm` environment, so renaming
# either requires updating it there too.
on:
    release:
        types: [published]

permissions: {}

jobs:
    ci:
        name: CI
        uses: ./.github/workflows/ci.yml
        permissions:
            contents: read

    publish:
        name: Publish to npm
        needs: ci
        runs-on: ubuntu-latest
        # Requires approval from a reviewer and only accepts `v*` tags (environment settings).
        environment: npm
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: lts/*
                  registry-url: https://registry.npmjs.org
            - name: Check release tag matches package version
              env:
                  TAG: ${{ github.event.release.tag_name }}
              run: |
                  version="v$(node -p "require('./package.json').version")"
                  if [ "$TAG" != "$version" ]; then
                      echo "::error::Release tag $TAG does not match package.json version $version"
                      exit 1
                  fi
            - name: Check npm supports trusted publishing
              run: |
                  npm_version="$(npm --version)"
                  if ! node -e "const [a, b, c] = process.argv[1].split('.').map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)" "$npm_version"; then
                      echo "::error::npm $npm_version is older than 11.5.1, the minimum for trusted publishing"
                      exit 1
                  fi
            - run: npm ci
            # Pre-releases go to the `next` dist-tag so they aren't installed by default.
            - name: Publish
              env:
                  DIST_TAG: ${{ github.event.release.prerelease && 'next' || 'latest' }}
              run: npm publish --access public --tag "$DIST_TAG"
